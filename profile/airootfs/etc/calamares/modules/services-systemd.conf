---
units:
  - name: "NetworkManager"
    action: "enable"
  - name: "bluetooth"
    action: "enable"
  - name: "sddm"
    action: "enable"
  - name: "neos-autoupdate.timer"
    action: "enable"
  - name: "neos-driver-manager"
    action: "enable"
  - name: "neos-vm-graphics"
    action: "enable"
  - name: "fstrim.timer"
    action: "enable"
  - name: "ufw"
    action: "enable"
  # Socket-activated: cupsd only starts (and only holds RAM) on first print use.
  - name: "cups.socket"
    action: "enable"
  - name: "cups.path"
    action: "enable"
  - name: "thermald"
    action: "enable"
  - name: "ModemManager"
    action: "enable"
  # Timeline snapshots: /etc/snapper/configs/root sets TIMELINE_CREATE=yes,
  # but without these timers no hourly snapshots (and no cleanup of them)
  # ever happen — the config alone only covers pacman-transaction snapshots.
  - name: "snapper-timeline.timer"
    action: "enable"
  - name: "snapper-cleanup.timer"
    action: "enable"
  # VM guest agents for systems installed inside virtual machines (clipboard,
  # dynamic resolution, host queries). Safe to enable unconditionally: the
  # NeOS condition drop-ins under /etc/systemd/system/*.d/ skip each agent on
  # the wrong platform instead of failing the unit.
  - name: "vboxservice"
    action: "enable"
  - name: "vmtoolsd"
    action: "enable"
  - name: "qemu-guest-agent"
    action: "enable"
  - name: "spice-vdagentd"
    action: "enable"

# Default the installed system to graphical.target so it boots into SDDM/Plasma
# instead of a text login on tty1. Without this the netinstalled system has no
# explicit default target and can come up in multi-user (text) mode.
  - name: "graphical.target"
    action: "set-default"
    mandatory: true
