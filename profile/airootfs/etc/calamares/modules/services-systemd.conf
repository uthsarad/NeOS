  # Timeline snapshots: /etc/snapper/configs/root sets TIMELINE_CREATE=yes,
  # but without these timers no hourly snapshots (and no cleanup of them)
  # ever happen — the config alone only covers pacman-transaction snapshots.
  - name: "snapper-timeline.timer"
    action: "enable"
  - name: "snapper-cleanup.timer"
    action: "enable"
  # Snapshot boot entries: grub-btrfsd watches /.snapshots and regenerates the
  # GRUB menu whenever snapper creates or removes a snapshot, so a known-good
  # snapshot can be booted from the GRUB menu when the system will not reach a
  # desktop (the recovery path the manual promises).
  - name: "grub-btrfsd"
    action: "enable"
    mandatory: false
