# users.conf
---
# Minimal default groups: systemd-logind (uaccess ACLs), PipeWire and polkit
# grant active local seat sessions dynamic access to GPU/audio/removable media,
# USB printers and NetworkManager without static supplementary groups. Static
# membership in `input` (/dev/input/event* 0660 root:input) would bypass
# Wayland keystroke isolation; `lp`, `network`, `video` and `storage` are
# similarly unnecessary and flagged by security baselines.
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - name: wheel
      must_exist: false
      system: true

autologinGroup: autologin
doAutologin: false

sudoersGroup: wheel
sudoersConfigureWithGroup: true
setRootPassword: false
doReusePassword: false

passwordRequirements:
    minLength: 6

user:
  shell: /bin/zsh
  forbidden_names: [ root, liveuser ]

hostname:
  location: EtcFile
  writeHostsFile: true
  template: "neos-${cpu}"

presets:
    fullName:
        editable: true
    loginName:
        editable: true
