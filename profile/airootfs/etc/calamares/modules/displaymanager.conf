# displaymanager.conf
---
displaymanagers:
  - sddm

# The installed system's session is chosen at every boot by
# neos-session-select.service: Wayland on known-good GPUs, X11 in VMs, with
# nomodeset and on unknown display drivers (override in /etc/neos/session.conf).
# The value written here is only the safe floor it starts from.
defaultDesktopEnvironment:
    executable: "startplasma-x11"
    desktopFile: "plasmax11"

basicSetup: false
