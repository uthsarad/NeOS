# Runs in the installed target after service enablement and bootloader setup.
# Do not report a successful desktop installation if it would boot to a TTY
# because the login manager, fallback desktop or graphical target is missing.
---
dontChroot: false
timeout: 30
script:
    - command: "test -x /usr/bin/sddm && test -x /usr/bin/Xorg && test -x /usr/bin/startxfce4"
    - command: "test -f /usr/share/xsessions/xfce.desktop && test -f /usr/share/wayland-sessions/plasma.desktop"
    - command: "systemctl is-enabled --quiet sddm.service"
    - command: "bash -c 'test \"$(systemctl get-default)\" = graphical.target'"
i18n:
    name: "Verify graphical desktop"
