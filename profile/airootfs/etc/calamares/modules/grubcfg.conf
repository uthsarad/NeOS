# grubcfg.conf
#
# Edit the installed /etc/default/grub in place instead of regenerating it.
# neospacstrap has already copied NeOS's /etc/default/grub onto the target;
# `overwrite: true` (with no `defaults:` map) threw that away and left only
# GRUB_DISTRIBUTOR and the kernel command line, so installed systems lost the
# boot-menu theme, timeout, os-prober (dual boot) and the grub-btrfs snapshot
# submenu name. In edit mode Calamares still sets the distributor and merges its
# own kernel parameters (resume, encryption) with ours.
---
overwrite: false
