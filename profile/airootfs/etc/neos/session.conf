# Display session for the login screen and Plasma.
#
#   auto     Wayland on Intel, AMD and NVIDIA (proprietary driver) graphics;
#            X11 in virtual machines, with nomodeset and on other drivers.
#   wayland  Always Wayland.
#   x11      Always X11.
#
# Applied at the next boot by neos-session-select.service. For a single boot,
# add neos.session=wayland or neos.session=x11 to the kernel command line.
SESSION=auto
