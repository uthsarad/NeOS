# NeOS: make snapshots booted from the GRUB menu usable.
#
# grub-btrfs adds every snapper snapshot to the GRUB menu, but snapper
# snapshots are read-only, so a system booted from one cannot start the login
# screen or the desktop (they need a writable /var/lib and /etc). The
# grub-btrfs-overlayfs hook layers a temporary writable overlay on top of a
# read-only root; on a normal boot it does nothing.
#
# mkinitcpio sources this file after /etc/mkinitcpio.conf, i.e. after
# Calamares' initcpiocfg has written HOOKS. The guard keeps it a no-op where the
# hook does not apply: the live image (grub-btrfs is installed-only) and a
# systemd-based initramfs (the hook is a busybox runtime hook).
if [[ -e /usr/lib/initcpio/install/grub-btrfs-overlayfs ]] \
    && [[ " ${HOOKS[*]} " != *" systemd "* ]] \
    && [[ " ${HOOKS[*]} " != *" grub-btrfs-overlayfs "* ]]; then
    HOOKS+=(grub-btrfs-overlayfs)
fi
