# Only start the QEMU guest agent when the host actually provides its virtio
# channel. Enabled by default (live session and installed systems), the agent
# exits non-zero with no channel present — bare metal, other hypervisors, and
# QEMU guests launched without `-device virtio-serial + guest agent channel`
# would all show a failed unit in `neos-doctor`.
[Unit]
ConditionPathExists=/dev/virtio-ports/org.qemu.guest_agent.0
