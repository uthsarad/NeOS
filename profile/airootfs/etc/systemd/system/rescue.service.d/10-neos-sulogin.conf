# Calamares sets setRootPassword: false (locked root account; admin access is
# via wheel + sudo). Without SYSTEMD_SULOGIN_FORCE=1, systemd's sulogin refuses
# console access in rescue mode ("Cannot open access to console, the root
# account is locked"), locking local console owners out of emergency Btrfs/fstab
# recovery without external boot media.
[Service]
Environment=SYSTEMD_SULOGIN_FORCE=1
