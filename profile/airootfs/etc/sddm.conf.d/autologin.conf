# Live-session autologin.
#
# Session here is the safe floor, the X11 Plasma session (plasmax11, from
# plasma-x11-session). neos-session-select.service overrides it at boot from
# zz-neos-session.conf: the Wayland session (plasma) on known-good GPUs, X11 in
# VMs, with nomodeset and on unknown display drivers. On Wayland, KWin has no
# uncomposited mode; on software rendering (VMs without 3D) it stops servicing
# input, which is why those stay on X11.
[Autologin]
User=liveuser
Session=plasmax11
