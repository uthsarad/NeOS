# Safe floor: the login screen runs on X11 unless told otherwise.
#
# NeOS defaults to Wayland, but that decision is made per boot by
# neos-session-select.service, which writes zz-neos-session.conf (sorted last,
# so it overrides this file) with Wayland on known-good GPUs and X11 in VMs,
# with nomodeset and on unknown display drivers. This file only matters if that
# service did not run: Wayland that cannot start leaves a hang at "Terminate
# Plymouth Boot Screen", X11 boots on virtually everything.
[General]
DisplayServer=x11
