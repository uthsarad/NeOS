SERIAL 0 115200
UI vesamenu.c32
MENU TITLE NeOS - A New Chapter
MENU BACKGROUND splash.png

MENU WIDTH 78
MENU MARGIN 4
MENU ROWS 10
MENU VSHIFT 8
MENU TABMSGROW 18
MENU CMDLINEROW 18
MENU HELPMSGROW 20
MENU HELPMSGENDROW 29

MENU COLOR border       30;44   #ffb89a61 #e0171b20 std
MENU COLOR title        1;36;44 #ffecd9ae #e0171b20 std
MENU COLOR sel          7;37;40 #fffff0cc #ff66543b all
MENU COLOR unsel        37;44   #ffbdb6a4 #e0171b20 std
MENU COLOR help         37;40   #c0ffffff #a0000000 std
MENU COLOR timeout_msg  37;40   #80ffffff #00000000 std
MENU COLOR timeout      1;37;40 #c0ffffff #00000000 std
MENU COLOR msg07        37;40   #90ffffff #a0000000 std
MENU COLOR tabmsg       31;40   #30ffffff #00000000 std

MENU CLEAR
MENU IMMEDIATE

# 30 = 3s (units are 1/10 s). Long enough to pick Copy-to-RAM / Safe Graphics
# / Verbose; MENU IMMEDIATE means any keypress still halts the countdown.
# (syslinux TIMEOUT 0 means "wait forever", so we cannot use 0 here.)
TIMEOUT 30
ONTIMEOUT neos64
DEFAULT neos64
