name: Auto-merge into testing

# testing is the integration branch: every non-draft PR that targets it from a
# branch of THIS repository is merged automatically, with `--admin` when branch
# rules would otherwise block. main is not in scope — it still only moves by a
# maintainer.
#
# Pull requests from forks are NOT auto-merged: every push to testing builds
# and publishes a release (GitHub + SourceForge), so auto-merging forks would
# let anyone with a GitHub account ship code in a NeOS release. A fork PR gets
# a one-time comment and waits for a maintainer, who can merge it by hand or
# run this workflow manually (workflow_dispatch) with its URL — that is an
# explicit human decision, so the manual path accepts forks.
#
# This workflow never checks out PR code. It only calls `gh` against the
# pull request URL from the event payload, which is why pull_request_target
# is safe to use here (write token + secrets, untrusted code is not run).

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [testing]
  workflow_dispatch:
    inputs:
      pr_url:
        description: Pull request URL to merge into testing
        required: true
        type: string

concurrency:
  group: auto-merge-testing-${{ github.event.pull_request.number || inputs.pr_url }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  merge-into-testing:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.base.ref == 'testing')
    steps:
      - name: Approve and merge
        env:
          GH_TOKEN: ${{ secrets.JULES_AUTO_MERGE_TOKEN != '' && secrets.JULES_AUTO_MERGE_TOKEN || secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_url || github.event.pull_request.html_url }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail

          if [[ -z "${PR_URL:-}" ]]; then
            echo "PR_URL is required." >&2
            exit 1
          fi

          echo "Inspecting PR: $PR_URL"

          PR_JSON="$(gh pr view "$PR_URL" --json state,baseRefName,isDraft,isCrossRepository,url)"
          PR_STATE="$(printf '%s' "$PR_JSON" | jq -r '.state')"
          PR_BASE="$(printf '%s' "$PR_JSON" | jq -r '.baseRefName')"
          PR_DRAFT="$(printf '%s' "$PR_JSON" | jq -r '.isDraft')"
          PR_FROM_FORK="$(printf '%s' "$PR_JSON" | jq -r '.isCrossRepository')"

          if [[ "$PR_STATE" != "OPEN" ]]; then
            echo "PR is in state $PR_STATE. Nothing to merge."
            exit 0
          fi

          if [[ "$PR_BASE" != "testing" ]]; then
            echo "Refusing to auto-merge a PR targeting '$PR_BASE' (only testing is automatic)." >&2
            exit 1
          fi

          if [[ "$PR_DRAFT" == "true" ]]; then
            echo "PR is a draft. Skipping."
            exit 0
          fi

          # Forks are never merged automatically (see header). Comment once,
          # when the PR is opened or reopened, not on every push to it.
          if [[ "$PR_FROM_FORK" != "false" && "$EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "PR comes from a fork (isCrossRepository=$PR_FROM_FORK); leaving it for a maintainer."
            if [[ "$EVENT_ACTION" == "opened" || "$EVENT_ACTION" == "reopened" ]]; then
              gh pr comment "$PR_URL" --body "Thanks! Pull requests from forks are not merged into \`testing\` automatically, because \`testing\` publishes releases. A maintainer will review and merge this." || true
            fi
            exit 0
          fi

          gh pr ready "$PR_URL" 2>/dev/null || true
          gh pr review "$PR_URL" --approve \
            --body "Auto-approved: PRs into \`testing\` merge automatically." \
            || echo "Note: could not approve (self-review or already approved)."

          # Land it. --admin is intentional: testing is the firehose, and a
          # required-check deadlock must not strand a PR. main is unaffected.
          merged=0
          if gh pr merge "$PR_URL" --squash --delete-branch --admin; then
            echo "Merged (squash, admin)."
            merged=1
          elif gh pr merge "$PR_URL" --squash --delete-branch; then
            echo "Merged (squash)."
            merged=1
          elif gh pr merge "$PR_URL" --merge --delete-branch --admin; then
            echo "Merged (merge commit, admin)."
            merged=1
          elif gh pr merge "$PR_URL" --merge --delete-branch; then
            echo "Merged (merge commit)."
            merged=1
          fi

          if [[ "$merged" -ne 1 ]]; then
            echo "Failed to merge $PR_URL into testing." >&2
            gh pr comment "$PR_URL" --body "Auto-merge into \`testing\` failed. A maintainer should merge this by hand (or re-run **Auto-merge into testing**)." || true
            exit 1
          fi

          gh pr comment "$PR_URL" --body "Merged into \`testing\` automatically." || true
