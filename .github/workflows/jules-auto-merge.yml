name: Auto-merge Jules

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr_url:
        description: Pull request URL to approve and merge
        required: true
        type: string

concurrency:
  group: auto-merge-jules-${{ github.event.pull_request.number || inputs.pr_url }}
  cancel-in-progress: false

jobs:
  approve-and-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    if: >-
      (github.event_name == 'workflow_dispatch' ||
       github.actor == 'google-labs-jules[bot]' ||
       github.actor == 'google-labs-jules' ||
       github.actor == 'NimuthuGanegoda' ||
       github.actor == 'RaidenShogun-AI' ||
       github.actor == 'MikoYae-AI' ||
       github.event.pull_request.user.login == 'google-labs-jules[bot]' ||
       github.event.pull_request.user.login == 'google-labs-jules' ||
       github.event.pull_request.user.login == 'NimuthuGanegoda' ||
       github.event.pull_request.user.login == 'RaidenShogun-AI' ||
       github.event.pull_request.user.login == 'MikoYae-AI' ||
       github.actor == github.repository_owner) &&
      (github.event_name != 'pull_request_review' || github.event.review.state == 'approved')
    steps:
      - name: Auto-merge
        env:
          GH_TOKEN: ${{ secrets.JULES_AUTO_MERGE_TOKEN != '' && secrets.JULES_AUTO_MERGE_TOKEN || secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_url || github.event.pull_request.html_url }}
          HAS_PAT: ${{ secrets.JULES_AUTO_MERGE_TOKEN != '' }}
        run: |
          set -euo pipefail

          if [[ -z "${PR_URL:-}" ]]; then
            echo "PR_URL is required. For workflow_dispatch runs, provide the pr_url input." >&2
            exit 1
          fi

          echo "Inspecting PR: $PR_URL"

          PR_JSON="$(gh pr view "$PR_URL" --json state,baseRefName,isDraft,url)"
          PR_STATE="$(printf '%s' "$PR_JSON" | jq -r '.state')"
          PR_BASE="$(printf '%s' "$PR_JSON" | jq -r '.baseRefName')"
          PR_DRAFT="$(printf '%s' "$PR_JSON" | jq -r '.isDraft')"

          if [[ "$PR_STATE" != "OPEN" ]]; then
            echo "PR is in state $PR_STATE. Skipping auto-merge."
            exit 0
          fi

          if [[ "$PR_DRAFT" == "true" ]]; then
            echo "PR is a draft. Skipping."
            exit 0
          fi

          # REDIRECT: If the PR targets 'main', retarget it to 'testing'
          if [[ "$PR_BASE" == "main" ]]; then
            echo "PR targets 'main'. Jules changes must target 'testing'. Attempting redirect..."
            if gh pr edit "$PR_URL" --base testing; then
              echo "Successfully redirected PR base to 'testing'."
              PR_BASE="testing"
              sleep 5
            else
              echo "ERROR: Failed to redirect PR to 'testing'. Blocking merge to protect 'main'." >&2
              gh pr comment "$PR_URL" --body "Auto-merge blocked: Target branch was \`main\`. Jules automated changes are restricted to \`testing\` and could not be automatically retargeted." || true
              exit 1
            fi
          fi

          # STRICT GUARD: Refuse to auto-merge into anything other than 'testing'
          if [[ "$PR_BASE" != "testing" ]]; then
            echo "Refusing to auto-merge a PR targeting '$PR_BASE' (only 'testing' is permitted for automated merges)." >&2
            exit 1
          fi

          # If the PR changes workflow files, verify PAT availability
          if gh pr view "$PR_URL" --json files --jq '.files[].path' | grep -q '^.github/workflows/'; then
            if [[ "$HAS_PAT" != "true" ]]; then
              echo "PR modifies .github/workflows/* but JULES_AUTO_MERGE_TOKEN is missing."
              gh pr comment "$PR_URL" --body "Auto-merge skipped: This PR modifies workflow files but the required secret \`JULES_AUTO_MERGE_TOKEN\` is not configured. A maintainer must merge this PR manually." || true
              exit 0
            fi
          fi

          echo "Approving PR..."
          gh pr review "$PR_URL" --approve             --body "Auto-approved: Jules PR redirected/merged into \`testing\`."             || echo "Note: Could not approve (maybe already approved or self-review?)"

          echo "Setting PR to ready..."
          gh pr ready "$PR_URL" 2>/dev/null || true

          echo "Executing forced auto-merge into testing..."
          merged=0
          if gh pr merge "$PR_URL" --squash --delete-branch --auto --admin; then
            echo "Merged (squash, auto, admin)."
            merged=1
          elif gh pr merge "$PR_URL" --squash --delete-branch --auto; then
            echo "Merged (squash, auto)."
            merged=1
          elif gh pr merge "$PR_URL" --squash --delete-branch --admin; then
            echo "Merged (squash, admin)."
            merged=1
          elif gh pr merge "$PR_URL" --squash --delete-branch; then
            echo "Merged (squash)."
            merged=1
          elif gh pr merge "$PR_URL" --merge --delete-branch --auto --admin; then
            echo "Merged (merge commit, auto, admin)."
            merged=1
          elif gh pr merge "$PR_URL" --merge --delete-branch --auto; then
            echo "Merged (merge commit, auto)."
            merged=1
          elif gh pr merge "$PR_URL" --merge --delete-branch --admin; then
            echo "Merged (merge commit, admin)."
            merged=1
          elif gh pr merge "$PR_URL" --merge --delete-branch; then
            echo "Merged (merge commit)."
            merged=1
          fi

          if [[ "$merged" -ne 1 ]]; then
            echo "WARNING: Failed to auto-merge PR into testing automatically." >&2
            exit 1
          fi

          echo "Successfully merged into testing."
