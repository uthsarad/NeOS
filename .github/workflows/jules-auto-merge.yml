# merging `testing`. A PR whose head IS `testing` (the release PR) is left alone.
#
# This workflow never checks out PR code. It only calls `gh` against the
# pull request URL from the event payload, which is why pull_request_target
# is safe to use here (write token + secrets, untrusted code is not run).
